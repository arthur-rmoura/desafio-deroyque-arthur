name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testes unitários + integração (o runner tem Docker, então os testes com Testcontainers também rodam).
      - name: Build e testes
        run: ./mvnw -B verify

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      # Garante que a imagem continua construindo. Em um pipeline real, a imagem seria publicada no
      # registry (tag = SHA do commit) apenas a partir da branch principal.
      - name: Build da imagem Docker
        run: docker build -t activation-service:${{ github.sha }} .
