# Toda configuração sensível ou dependente de ambiente vem de variáveis de ambiente.
# Os valores padrão abaixo servem apenas para desenvolvimento local (docker compose).
spring:
  application:
    name: activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000 # ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emissor esperado no claim "iss" e endereço das chaves públicas (JWKS) usadas na validação da assinatura.
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8090/activation}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8090/activation/jwks}
          audiences: ${OAUTH2_AUDIENCE:activation-service}
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Readiness depende do banco (sem ele a instância não atende); liveness não, para o orquestrador
        # não reiniciar a aplicação por causa de uma indisponibilidade externa.
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  include-application-name: false
  level:
    # Violação de unicidade em criações concorrentes é fluxo esperado (tratada como repetição); sem isto o
    # Hibernate a registra como ERROR. Demais erros de banco continuam chegando à aplicação como exceção.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: off

activation:
  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
    api-key: ${PROVIDER_API_KEY:local-dev-key}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
  processing:
    max-attempts: 5
    initial-backoff: 2s
    max-backoff: 5m
    lease-duration: 30s
    poll-interval: 5s
    batch-size: 50
    worker-threads: 8
    queue-capacity: 200
    scheduler-enabled: true
