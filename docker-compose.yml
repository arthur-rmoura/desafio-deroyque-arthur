# Ambiente local completo: aplicação + PostgreSQL + provedor de ativação simulado (WireMock)
# + servidor OAuth2 simulado (emite JWT via client credentials).
#
#   docker compose up --build
#
# Veja o README para obter um token e chamar a API.
services:
  app:
    build: .
    ports:
      - "8080:8080"   # API
      - "8081:8081"   # Actuator (health, métricas) — em produção não é exposto publicamente
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/activation
      DB_USERNAME: activation
      DB_PASSWORD: activation
      PROVIDER_BASE_URL: http://provider-mock:8080
      PROVIDER_API_KEY: local-dev-key
      # O token é obtido pelo host em localhost:8090, então é esse o emissor gravado no claim "iss";
      # as chaves públicas são buscadas pela rede interna do compose.
      OAUTH2_ISSUER_URI: http://localhost:8090/activation
      OAUTH2_JWK_SET_URI: http://oauth2-mock:8080/activation/jwks
      OAUTH2_AUDIENCE: activation-service
    depends_on:
      postgres:
        condition: service_healthy
      provider-mock:
        condition: service_started
      oauth2-mock:
        condition: service_started
    stop_grace_period: 40s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10

  provider-mock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro

  oauth2-mock:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    ports:
      - "8090:8080"
    environment:
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./docker/oauth2/config.json:/config/config.json:ro

volumes:
  postgres-data:
